name: Mutation testing

# mutmutは内部でos.fork()を使用しておりPOSIX専用(Windows非対応、docs/defects.md DEF-003参照)。
# 実行コストが高いため、通常のCI(ci.yml)とは分離し、main pushと週次・手動実行のみに限定する。
#
# 注記(FIX-12): このワークフローはWindows非対応のためローカルで一度も実行できておらず、
# mutmutのCLIの正確な引数仕様(特に`mutmut results`の`--all`オプションの形式)を
# 実機で確認できていない。Codexレビューにより「mutmut 3系の`results --all`は
# 真偽値を伴う形式(例: `--all true`)であり、単純なフラグではない」と指摘されたため、
# 複数の呼び出し形式を順に試すフォールバック構成にしている。初回CI実行で
# 実際に動く形式が判明したら、このフォールバックは簡略化すること。
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 18 * * 0" # 毎週日曜 18:00 UTC(日本時間 月曜3:00)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  mutmut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      # 実行時の実環境を証跡化する(FIX-15: 依存は下限指定のみで非再現のため、
      # 少なくとも「その時何が実際にインストールされたか」を残す)。
      - name: Record installed package versions
        run: python -m pip freeze > pip-freeze.txt

      - name: Run mutation testing
        # FIX2-01(Codex#1): 生存ミュータントの存在は正常な非ゼロ終了として許容し
        # 次段で閾値判定するが、mutmut自体のクラッシュ・設定ミスまで`|| true`で
        # 握り潰すと原因が分からなくなる。ここでは終了コードを見ずに継続し、
        # 実際に集計できたか(1件も収集されなかったか)は次段の
        # scripts/mutation_score.pyが判定してワークフローを赤にする。
        run: mutmut run || true

      - name: Collect mutmut results
        run: |
          set +e
          # FIX-12: `mutmut results --all`の正確な引数仕様が実機未確認のため、
          # 複数の呼び出し形式を順に試す(最初に成功したものを採用)。
          mutmut results --all true > mutmut-results.txt 2>mutmut-results-stderr.txt
          if [ $? -ne 0 ]; then
            echo "「mutmut results --all true」が失敗。「mutmut results --all」を試します" >&2
            mutmut results --all > mutmut-results.txt 2>mutmut-results-stderr.txt
          fi
          if [ $? -ne 0 ]; then
            echo "「mutmut results --all」も失敗。「mutmut results」(non-killedのみ)にフォールバックします" >&2
            echo "WARNING: killedの内訳が取得できないため、スコアが不正確になる可能性があります" >&2
            mutmut results > mutmut-results.txt 2>mutmut-results-stderr.txt
          fi
          set -e
          cat mutmut-results-stderr.txt >&2 || true

      - name: Summarize mutation score
        id: summary
        # FIX2-01/14(Codex#1/#5): 集計ロジックをヒアドキュメント内Pythonから
        # scripts/mutation_score.pyへ切り出し、pytestでテスト可能にした
        # (tests/test_mutation_score.py参照)。「1件も収集できなかった」場合は
        # このスクリプトが非ゼロ終了し、continue-on-errorを付けていないため
        # ワークフロー自体が赤になる(=スコアの良し悪しに関わらず収集できた
        # ことを保証する。従来はここが`SystemExit(1)`のみで、CIとして
        # 明示的に失敗として扱われるかは検証できていなかった)。
        run: python scripts/mutation_score.py mutmut-results.txt mutmut-score.txt

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: |
            mutmut-results.txt
            mutmut-results-stderr.txt
            mutmut-score.txt
            pip-freeze.txt
          retention-days: 30

      # 閾値ゲート(目標80%)。
      # 注記: mutmutはネイティブWindowsで実行不可なためローカル(開発機)では未検証。
      # 上記の通りresultsコマンドの引数仕様も実機未確認のため、このゲートは
      # **試験運用中**の位置づけとし、continue-on-errorでCI全体を止めない。
      # このワークフローの初回実行結果を見て、想定通り動作すれば continue-on-error を外し
      # 正式なゲートにする(docs/test-report.md 残存リスク参照)。
      - name: Gate on mutation score threshold (80%, 試験運用中)
        continue-on-error: true
        run: |
          score=$(cat mutmut-score.txt)
          awk -v s="$score" 'BEGIN { exit !(s+0 >= 80) }'
